<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>رحاب البرمجة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0a0c16;
    --bg-1:#10131f;
    --card:#151a2c;
    --card-2:#1a2036;
    --border:#262c46;
    --border-soft:#333c5f;
    --text-main:#f5f7fd;
    --text-sub:#9298b3;
    --text-dim:#666d8c;
    --ok:#3ddc97;
    --bad:#ff6b6b;
    --radius-lg:24px;
    --radius-md:16px;
    --radius-sm:10px;
    /* default accent before a language is picked */
    --c1:#5b86e5;
    --c2:#36d1dc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 8% -8%, rgba(91,134,229,0.14), transparent 55%),
      radial-gradient(800px 480px at 95% 5%, rgba(255,152,32,0.10), transparent 55%),
      radial-gradient(760px 460px at 50% 105%, rgba(168,85,247,0.10), transparent 55%),
      var(--bg-0);
    color:var(--text-main);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding:52px 20px 90px;
    overflow-x:hidden;
  }
  .page{max-width:1180px;margin:0 auto;}

  /* hero */
  .hero{text-align:center;margin-bottom:44px;}
  .hero .brand-badge{
    display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);
    border-radius:30px;padding:6px 16px;font-size:12.5px;font-weight:700;color:var(--text-sub);margin-bottom:18px;
  }
  .hero .brand-badge span.dot{width:7px;height:7px;border-radius:50%;background:linear-gradient(90deg,#5b86e5,#f89820,#ffd43b);}
  .hero h1{
    font-size:clamp(30px,4.6vw,48px);
    font-weight:900;
    margin:0 0 14px;
    letter-spacing:-0.5px;
    background:linear-gradient(90deg,#36d1dc,#5b86e5,#a855f7,#f89820,#ffd43b,#36d1dc);
    background-size:250% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 8s linear infinite;
  }
  @keyframes shimmer{ to{ background-position:250% center; } }
  .hero p.subtitle{
    color:var(--text-sub);
    font-size:16px;
    font-weight:500;
    margin:0;
    max-width:560px;
    margin-inline:auto;
    line-height:1.8;
  }

  /* language grid */
  .lang-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:14px;
  }
  .lang-card{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--card-2),var(--card));
    border:1.5px solid var(--border);
    border-radius:var(--radius-lg);
    padding:40px 14px 28px;
    text-align:center;
    cursor:pointer;
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .lang-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,var(--lc1),var(--lc2));
  }
  .lang-card:hover{
    transform:translateY(-4px);
    border-color:var(--border-soft);
    box-shadow:0 14px 32px -14px color-mix(in srgb, var(--lc1) 55%, transparent);
  }
  .lang-icon{
    width:64px;height:64px;margin:0 auto 16px;border-radius:50%;
    background:linear-gradient(135deg,var(--lc1),var(--lc2));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 22px -8px color-mix(in srgb, var(--lc1) 60%, transparent);
  }
  .lang-icon svg{width:32px;height:32px;}
  .lang-card .lang-label{
    font-size:20px;
    font-weight:800;
    unicode-bidi:isolate;
    direction:ltr;
    display:inline-block;
  }
  .lang-card.active{
    border-color:var(--lc1);
    box-shadow:0 0 0 1.5px var(--lc1), 0 0 30px color-mix(in srgb, var(--lc1) 45%, transparent);
  }
  .lang-card.active .lang-label{
    background:linear-gradient(90deg,var(--lc1),var(--lc2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  /* tools */
  .tools-section{margin-top:38px;}
  .tools-caption{
    text-align:center;color:var(--text-dim);font-size:14px;font-weight:500;margin-bottom:16px;
  }
  .tools-caption b{color:var(--c1);font-weight:800;}
  .tools-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
  }
  .tool-btn{
    background:var(--card);
    border:1.5px solid var(--border);
    border-radius:var(--radius-md);
    padding:20px 10px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    cursor:pointer;
    color:var(--text-sub);
    transition:all .16s ease;
    font-family:inherit;
  }
  .tool-btn svg{width:26px;height:26px;stroke:var(--text-sub);transition:stroke .16s ease;}
  .tool-btn span{font-weight:700;font-size:15px;}
  .tool-btn:hover{border-color:var(--border-soft);color:var(--text-main);}
  .tool-btn:hover svg{stroke:var(--text-main);}
  .tool-btn.active{
    border-color:var(--c1);
    background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 16%,transparent),transparent);
    color:var(--c2);
    box-shadow:0 0 20px color-mix(in srgb,var(--c1) 22%,transparent);
  }
  .tool-btn.active svg{stroke:var(--c2);}

  /* content area */
  .content-area{margin-top:34px;}
  .panel-title{
    font-size:20px;font-weight:800;margin:0 0 4px;
  }
  .panel-title .accent{color:var(--c1);}
  .panel-sub{color:var(--text-dim);font-size:14px;margin:0 0 22px;}

  /* videos */
  .video-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
  }
  .video-card{
    background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-md);
    overflow:hidden;display:block;text-decoration:none;color:inherit;transition:border-color .15s, transform .15s;
  }
  .video-card:hover{border-color:var(--c1);transform:translateY(-2px);}
  .video-card .thumb-wrap{position:relative;padding-top:56.25%;background:linear-gradient(135deg,var(--c1),var(--c2));overflow:hidden;}
  .video-card .thumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .video-card .play-badge{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,rgba(0,0,0,0.05),rgba(0,0,0,0.35));
  }
  .video-card .play-badge svg{
    width:56px;height:56px;fill:rgba(255,255,255,0.92);filter:drop-shadow(0 2px 10px rgba(0,0,0,0.5));
    transition:transform .15s;
  }
  .video-card:hover .play-badge svg{transform:scale(1.08);fill:var(--c1);}
  .video-card .v-title{padding:14px 16px;font-weight:700;font-size:14.5px;line-height:1.5;}
  .video-card .v-open{padding:0 16px 14px;font-size:12.5px;color:var(--text-dim);font-weight:600;}

  /* summary */
  .summary-pager{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .summary-pager button{
    background:var(--bg-1);border:1px solid var(--border);border-radius:20px;padding:7px 15px;
    font-size:12.5px;font-weight:700;color:var(--text-sub);cursor:pointer;font-family:inherit;
    transition:all .15s;
  }
  .summary-pager button:hover{border-color:var(--border-soft);color:var(--text-main);}
  .summary-pager button.active{
    border-color:var(--c1);
    background:linear-gradient(160deg,color-mix(in srgb,var(--c1) 18%,transparent),transparent);
    color:var(--c2);
  }
  .summary-card{
    background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);
    padding:32px;line-height:2;font-size:15.5px;color:#dfe3ef;min-height:200px;
  }
  .summary-card h4{
    color:var(--c2);font-size:17px;font-weight:800;margin:22px 0 10px;
  }
  .summary-card h4:first-child{margin-top:0;}
  .summary-card ul{margin:0 0 8px;padding-inline-start:22px;}
  .summary-card li{margin-bottom:6px;}
  .summary-card p{margin:0 0 10px;}
  .summary-card pre{
    background:#090c17;border:1px solid var(--border-soft);border-radius:10px;padding:16px 18px;
    overflow-x:auto;direction:ltr;text-align:left;margin:10px 0 16px;line-height:1.7;
  }
  .summary-card pre code{background:none;padding:0;font-family:'Courier New',monospace;font-size:13.8px;color:#c9e8ff;}
  .summary-card code{
    background:rgba(255,255,255,0.08);padding:2px 7px;border-radius:6px;
    font-family:'Courier New',monospace;direction:ltr;display:inline-block;font-size:14px;color:var(--c2);
  }
  .summary-card .note{
    background:color-mix(in srgb,var(--c1) 10%,transparent);border-right:3px solid var(--c1);border-radius:8px;
    padding:12px 16px;margin:12px 0;font-size:14.5px;color:#e9edf7;
  }
  .summary-nav{display:flex;align-items:center;justify-content:space-between;margin-top:20px;gap:12px;flex-wrap:wrap;}
  .summary-nav button{
    background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:11px 22px;
    font-weight:800;font-family:inherit;font-size:14px;color:var(--text-main);cursor:pointer;transition:all .15s;
  }
  .summary-nav button:hover:not(:disabled){border-color:var(--c1);color:var(--c2);}
  .summary-nav button:disabled{opacity:.35;cursor:not-allowed;}
  .summary-nav .page-indicator{color:var(--text-dim);font-size:13px;font-weight:700;white-space:nowrap;}

  /* Q&A */
  .qa-list{display:flex;flex-direction:column;gap:16px;}
  .qa-card{
    background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);
    padding:26px 28px;transition:border-color .15s;
  }
  .qa-card:hover{border-color:var(--border-soft);}
  .qa-question{
    font-size:16.5px;font-weight:800;line-height:1.85;margin-bottom:16px;
    display:flex;align-items:flex-start;gap:12px;
  }
  .qa-number{
    flex-shrink:0;width:30px;height:30px;border-radius:50%;
    background:linear-gradient(135deg,var(--c1),var(--c2));color:#0a0c16;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;
    margin-inline-start:12px;
  }
  .qa-toggle-btn{
    background:transparent;border:1.5px solid var(--c1);color:var(--c2);border-radius:10px;
    padding:9px 20px;font-weight:700;font-family:inherit;font-size:13.5px;cursor:pointer;
    transition:all .15s;
  }
  .qa-toggle-btn:hover{background:color-mix(in srgb,var(--c1) 14%,transparent);}
  .qa-solution{display:none;margin-top:16px;}
  .qa-solution.show{display:block;}
  .qa-solution pre{
    background:#090c17;border:1px solid var(--border-soft);border-radius:10px;padding:16px 18px;
    overflow-x:auto;direction:ltr;text-align:left;margin:0;line-height:1.7;
  }
  .qa-solution pre code{background:none;padding:0;font-family:'Courier New',monospace;font-size:13.8px;color:#c9e8ff;}

  /* quiz */
  .quiz-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:32px;}
  .quiz-progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px;}
  .quiz-progress .bar{flex:1;height:6px;background:var(--bg-0);border-radius:6px;overflow:hidden;}
  .quiz-progress .bar-fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .25s ease;}
  .quiz-progress .count{font-size:13px;color:var(--text-dim);font-weight:700;white-space:nowrap;}
  .quiz-question{font-size:18.5px;font-weight:800;margin:0 0 22px;line-height:1.7;}
  .quiz-options{display:flex;flex-direction:column;gap:12px;}
  .quiz-opt{
    text-align:right;background:var(--bg-1);border:1.5px solid var(--border);border-radius:12px;
    padding:14px 18px;font-family:inherit;font-size:15px;color:var(--text-main);cursor:pointer;
    transition:all .15s;line-height:1.6;
  }
  .quiz-opt:hover:not(.locked){border-color:var(--border-soft);background:var(--card-2);}
  .quiz-opt.correct{border-color:var(--ok);background:rgba(61,220,151,0.10);color:var(--ok);}
  .quiz-opt.wrong{border-color:var(--bad);background:rgba(255,107,107,0.10);color:var(--bad);}
  .quiz-opt.locked{cursor:default;}
  .quiz-explain{
    margin-top:20px;padding:16px 18px;background:var(--bg-1);border-right:3px solid var(--c1);
    border-radius:10px;font-size:14.5px;line-height:1.9;color:#dfe3ef;display:none;
  }
  .quiz-footer{display:flex;justify-content:flex-end;margin-top:24px;}
  .quiz-next{
    background:linear-gradient(135deg,var(--c1),var(--c2));color:#0a0c16;border:none;border-radius:12px;padding:12px 28px;
    font-weight:800;font-family:inherit;font-size:15px;cursor:pointer;display:none;
  }
  .quiz-result{text-align:center;padding:20px 0;}
  .quiz-result .score{font-size:52px;font-weight:900;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0;}
  .quiz-result p{color:var(--text-sub);font-size:15px;margin:6px 0 26px;}
  .quiz-retry{
    background:transparent;color:var(--c2);border:1.5px solid var(--c1);border-radius:12px;
    padding:12px 26px;font-weight:800;font-family:inherit;font-size:15px;cursor:pointer;
  }

  @media (max-width:820px){
    .lang-grid{grid-template-columns:repeat(2,1fr);}
    .tools-grid{grid-template-columns:repeat(2,1fr);}
    .video-grid{grid-template-columns:1fr;}
  }
  @media (max-width:480px){
    body{padding:36px 12px 60px;}
    .hero{margin-bottom:32px;}
    .lang-grid{gap:12px;}
    .lang-card{padding:26px 8px 20px;border-radius:18px;}
    .lang-icon{width:52px;height:52px;margin-bottom:12px;}
    .lang-icon svg{width:26px;height:26px;}
    .lang-card .lang-label{font-size:17px;}
    .tools-grid{gap:10px;}
    .tool-btn{padding:16px 6px;}
    .tool-btn span{font-size:13.5px;}
    .quiz-card,.summary-card,.qa-card{padding:18px;}
    .quiz-question{font-size:16.5px;}
    .quiz-opt{padding:12px 14px;font-size:14px;}
    .qa-question{font-size:15px;}
    .summary-nav{justify-content:center;}
    .summary-nav .page-indicator{width:100%;text-align:center;order:3;}
  }
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <div class="brand-badge"><span class="dot"></span> منصّة تعليمية تفاعلية</div>
    <h1>رحاب البرمجة</h1>
    <p class="subtitle">اختر لغة البرمجة التي تريد إتقانها، وابدأ رحلتك من أول سطر كود وحتى احتراف الأساسيات — فيديوهات، ملخصات، نقاش مباشر مع الذكاء الاصطناعي، واختبارات شاملة</p>
  </header>

  <section class="lang-grid" id="langGrid"></section>

  <section class="tools-section" id="toolsSection" hidden>
    <p class="tools-caption">اختر ما تريد استكشافه في لغة <b id="toolsCaptionLang"></b></p>
    <div class="tools-grid" id="toolsGrid"></div>
  </section>

  <section class="content-area" id="contentArea"></section>

</div>

      {id:'Do34NKMq80c', title:'تعلم بايثون من الصفر إلى الاحتراف — كورس كامل'},

    ],
    summaryPages:[
      { title:'مقدمة والانطلاقة', body:`
        <h4>ما هي لغة بايثون؟</h4>
        <p>Python لغة برمجة عالية المستوى، سهلة القراءة، صممها جيدو فان روسوم عام 1991م. تشتهر ببساطة صياغتها القريبة من اللغة الإنجليزية الطبيعية، ما يجعلها من أفضل اللغات لتعلّم البرمجة من الصفر، وفي الوقت نفسه هي لغة احترافية تُستخدم في أكبر شركات التقنية بالعالم.</p>
        <p>بايثون لغة <b>ديناميكية الكتابة (Dynamically Typed)</b> — لا حاجة لتحديد نوع المتغير عند تعريفه، فالمفسّر (Interpreter) يحدد النوع تلقائيًا من القيمة، وتعتمد على المسافات البادئة (Indentation) بدل الأقواس {} لتحديد الكتل البرمجية.</p>
        <h4>بنية أول برنامج</h4>

        <p>لا حاجة لدالة main ولا لكلاسات ولا لفاصلة منقوطة في نهاية كل سطر — سطر واحد بسيط كافٍ لتشغيل أول برنامج، وهذا أحد أسباب شهرة بايثون كلغة بداية مثالية.</p>
      `},
      { title:'المتغيرات والإدخال والإخراج', body:`
        <h4>المتغيرات وأنواع البيانات</h4>
        <pre><code>age = 25            # int
price = 19.99       # float

    def __init__(self, name):

      { title:'مفاهيم احترافية متقدمة', body:`
        <h4>المولّدات (Generators)</h4>
        <pre><code>def count_up_to(n):
    i = 1
    while i &lt;= n:
        yield i
        i += 1

for num in count_up_to(5):
    print(num)</code></pre>
        <p>yield تحوّل الدالة إلى مولّد يُنتج القيم واحدة تلو الأخرى عند الطلب بدل حسابها كلها دفعة واحدة في الذاكرة، وهذا موفّر جدًا للذاكرة عند التعامل مع بيانات ضخمة أو تسلسلات لا نهائية.</p>
        <h4>الديكوريتورز (Decorators)</h4>
        <pre><code>def log_call(func):
    def wrapper(*args, **kwargs):
        print("جاري استدعاء:", func.__name__)
        return func(*args, **kwargs)
    return wrapper

@log_call
def greet(name):
    print("أهلًا", name)

greet("سارة")</code></pre>
        <p>الديكوريتور دالة تُغلّف دالة أخرى لإضافة سلوك جديد (كتسجيل الأحداث، أو قياس الوقت) دون تعديل كود الدالة الأصلية. الرمز @log_call فوق تعريف الدالة هو الصياغة المختصرة لتطبيق الديكوريتور.</p>
        <h4>List/Dict Comprehension متقدمة والبرمجة الوظيفية</h4>
        <pre><code>nums = [1, 2, 3, 4, 5, 6]
evens_squared = [x**2 for x in nums if x % 2 == 0]
print(evens_squared)  # [4, 16, 36]

doubled = list(map(lambda x: x * 2, nums))
total = sum(filter(lambda x: x &gt; 3, nums))</code></pre>
        <p>يمكن دمج شرط if داخل list comprehension لتصفية العناصر أثناء البناء. map وfilter مع دوال lambda مجهولة الاسم أدوات أساسية في الأسلوب الوظيفي (Functional Programming) داخل بايثون.</p>
        <h4>البرمجة اللامتزامنة (Async) — نظرة سريعة</h4>
        <pre><code>import asyncio

async def fetch_data():
    print("بدء الجلب...")
    await asyncio.sleep(2)
    print("اكتمل الجلب")

asyncio.run(fetch_data())</code></pre>
        <p>async وawait يسمحان بتنفيذ عمليات طويلة (كطلبات الشبكة) دون تجميد باقي البرنامج، وهما أساس بناء خوادم وتطبيقات عالية الأداء في بايثون الحديثة.</p>

      { title:'مقدمة والانطلاقة', body:`
        <h4>ما هي لغة C؟</h4>
        <p>لغة C إحدى أقدم وأهم لغات البرمجة الإجرائية، طوّرها دينيس ريتشي عام 1972م. تُعتبر لغة منخفضة المستوى نسبيًا لأنها تمنحك تحكمًا مباشرًا بالذاكرة والعتاد، ولذلك تُبنى عليها أغلب اللغات الحديثة.</p>
        <p>لا تحتوي C على إدارة تلقائية للذاكرة، فأنت من يقرر متى تُحجز الذاكرة ومتى تُحرَّر — وهذا يمنحها سرعة فائقة لكنه يتطلب دقة عالية.</p>
        <h4>بنية أول برنامج</h4>

int main() {
    printf("مرحبًا بالعالم\n");

}</code></pre>
        <p>#include يُدرج ملف الرأس القياسي، والدالة main هي نقطة بداية كل برنامج C، وreturn 0 تُخبر النظام أن البرنامج انتهى دون أخطاء.</p>

        <p>المؤشر هو أهم وأخطر مفهوم في C: متغير يخزّن عنوان مكان آخر في الذاكرة بدلًا من قيمة مباشرة.</p>
        <pre><code>int x = 10;

      { title:'مفاهيم احترافية متقدمة', body:`
        <h4>المؤشرات على الدوال (Function Pointers)</h4>
        <pre><code>int add(int a, int b) { return a + b; }
int subtract(int a, int b) { return a - b; }

int main() {
    int (*operation)(int, int) = add;
    printf("%d\n", operation(5, 3)); // 8
    operation = subtract;
    printf("%d\n", operation(5, 3)); // 2
    return 0;
}</code></pre>
        <p>يمكن لمتغير أن يخزّن عنوان دالة بأكملها، ثم يُستدعى عبره كأنه اسم الدالة نفسها. هذا يتيح تمرير سلوك مختلف كمعامل لدالة أخرى (Callbacks)، وهو أساس بناء أنظمة قابلة للتوسّع في C.</p>
        <h4>معالجة البتات (Bit Manipulation)</h4>
        <pre><code>unsigned char flags = 0;
flags |= (1 &lt;&lt; 2);   // تشغيل البت رقم 2
flags &amp;= ~(1 &lt;&lt; 2);  // إطفاء البت رقم 2
int isSet = (flags &gt;&gt; 3) &amp; 1; // فحص البت رقم 3</code></pre>
        <p>العمليات &lt;&lt; و&gt;&gt; تُزيح البتات يمينًا أو يسارًا، و| و&amp; وXOR تتحكم ببتات فردية مباشرة. هذا أساسي في البرمجة المدمجة (Embedded) للتحكم بسجلات العتاد (Hardware Registers) مباشرة.</p>
        <h4>البرمجة متعددة الملفات وملفات الرأس المخصصة</h4>
        <pre><code>// math_utils.h
#ifndef MATH_UTILS_H
#define MATH_UTILS_H
int square(int x);
#endif

// math_utils.c
#include "math_utils.h"
int square(int x) { return x * x; }

// main.c
#include &lt;stdio.h&gt;
#include "math_utils.h"
int main() {
    printf("%d\n", square(5));
    return 0;
}</code></pre>
        <p>المشاريع الحقيقية تُقسَّم على عدة ملفات: ملف .h يحتوي "إعلانات" الدوال (توقيعها فقط)، وملف .c يحتوي تنفيذها الفعلي. حراس #ifndef/#define/#endif يمنعون تضمين نفس الملف أكثر من مرة بالخطأ (Include Guards).</p>
        <h4>الماكرو والمعالج المسبق (Preprocessor Macros)</h4>
        <pre><code>#define MAX(a, b) ((a) &gt; (b) ? (a) : (b))
#define PI 3.14159

printf("%d\n", MAX(4, 9));       // 9
printf("%.2f\n", PI * 2);        // 6.28</code></pre>
        <p>#define تستبدل النص استبدالًا حرفيًا قبل الترجمة، فتصبح MAX(4,9) فعليًا ((4) > (9) ? (4) : (9)). مفيدة للثوابت والاختصارات، لكنها تحتاج حذرًا لأنها استبدال نصي وليست دالة حقيقية.</p>

        <pre><code>#include &lt;memory&gt;

        <p>unique_ptr يملك الذاكرة وحده ويحرّرها تلقائيًا عند انتهاء عمره، بينما shared_ptr يسمح لعدة مؤشرات بمشاركة نفس الذاكرة وتحريرها فقط عندما لا يبقى أي مرجع لها. هذا يحل مشكلة نسيان delete التي تسبب تسريب الذاكرة في الإدارة اليدوية.</p>

/* ---------------------------------------------------------
   STATE
--------------------------------------------------------- */
const state = { lang: null, tool: null };
const quizState = {};
const summaryState = {};
const qaState = {};
LANGUAGES.forEach(l => {
  quizState[l.key] = freshQuizState();
  summaryState[l.key] = { page: 0 };
  qaState[l.key] = {};
});

function freshQuizState(){
  return { current:0, score:0, selected:null, finished:false };
}

/* ---------------------------------------------------------
   RENDER: language grid
--------------------------------------------------------- */
const langGrid = document.getElementById('langGrid');
LANGUAGES.forEach(lang => {
  const card = document.createElement('div');
  card.className = 'lang-card';
  card.dataset.key = lang.key;
  card.style.setProperty('--lc1', lang.c1);
  card.style.setProperty('--lc2', lang.c2);
  card.innerHTML = `
    <div class="lang-icon">${lang.icon}</div>
    <span class="lang-label">${lang.label}</span>
  `;
  card.addEventListener('click', () => selectLanguage(lang.key));
  langGrid.appendChild(card);
});

function selectLanguage(key){
  state.lang = key;
  if(!state.tool) state.tool = 'videos';
  const lang = LANGUAGES.find(l => l.key === key);
  document.body.style.setProperty('--c1', lang.c1);
  document.body.style.setProperty('--c2', lang.c2);
  document.querySelectorAll('.lang-card').forEach(c=>{
    c.classList.toggle('active', c.dataset.key === key);
  });
  document.getElementById('toolsCaptionLang').textContent = CONTENT[key].name;
  document.getElementById('toolsSection').hidden = false;
  renderTools();
  renderContent();
  document.getElementById('toolsSection').scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ---------------------------------------------------------
   RENDER: tools row
--------------------------------------------------------- */
const toolsGrid = document.getElementById('toolsGrid');
function renderTools(){
  toolsGrid.innerHTML = '';
  TOOLS.forEach(tool => {
    const btn = document.createElement('button');
    btn.className = 'tool-btn' + (state.tool === tool.key ? ' active' : '');
    btn.innerHTML = `${ICONS[tool.icon]}<span>${tool.label}</span>`;
    btn.addEventListener('click', () => {
      state.tool = tool.key;
      renderTools();
      renderContent();
    });
    toolsGrid.appendChild(btn);
  });
}

/* ---------------------------------------------------------
   RENDER: content area dispatcher
--------------------------------------------------------- */
const contentArea = document.getElementById('contentArea');
function renderContent(){
  if(!state.lang || !state.tool){ contentArea.innerHTML=''; return; }
  const data = CONTENT[state.lang];
  if(state.tool === 'videos') return renderVideos(data);
  if(state.tool === 'summary') return renderSummary(data);
  if(state.tool === 'qa') return renderQA(data);
  if(state.tool === 'quiz') return renderQuiz(data);
}

function renderVideos(data){
  contentArea.innerHTML = `
    <h3 class="panel-title">فيديوهات شرح <span class="accent">${data.name}</span></h3>
    <p class="panel-sub">من الصفر وحتى نهاية الأساسيات — أفضل شروحات ${data.name} باللغة العربية</p>
    <div class="video-grid">
      ${data.videos.map(v => `
        <a class="video-card" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">
          <div class="thumb-wrap">
            <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="${v.title}" loading="lazy" onerror="this.style.display='none'">
            <div class="play-badge">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
          <div class="v-title">${v.title}</div>
          <div class="v-open">مشاهدة على يوتيوب ↗</div>
        </a>
      `).join('')}
    </div>
  `;
}

--------------------------------------------------------- */

  contentArea.innerHTML = `
    <h3 class="panel-title">ملخّص لغة <span class="accent">${data.name}</span></h3>
    <p class="panel-sub">من الصفر حتى نهاية الأساسيات — موزّعة على عدة صفحات</p>
    <div class="summary-pager" id="summaryPager"></div>
    <div class="summary-card" id="summaryBody"></div>
    <div class="summary-nav">
      <button id="prevPageBtn">◀ السابق</button>
      <span class="page-indicator" id="pageIndicator"></span>
      <button id="nextPageBtn">التالي ▶</button>
    </div>
  `;
  paintSummaryPager(data);
  paintSummaryBody(data);

  document.getElementById('prevPageBtn').addEventListener('click', () => {
    const st = summaryState[state.lang];
    if(st.page > 0){ st.page--; paintSummaryPager(data); paintSummaryBody(data); }
  });
  document.getElementById('nextPageBtn').addEventListener('click', () => {
    const st = summaryState[state.lang];
    if(st.page < data.summaryPages.length - 1){ st.page++; paintSummaryPager(data); paintSummaryBody(data); }
  });
}

function paintSummaryPager(data){
  const st = summaryState[state.lang];
  const pager = document.getElementById('summaryPager');
  pager.innerHTML = data.summaryPages.map((p,i) =>
    `<button class="${i===st.page?'active':''}" data-i="${i}">${i+1}. ${p.title}</button>`
  ).join('');
  pager.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      st.page = parseInt(btn.dataset.i);
      paintSummaryPager(data);
      paintSummaryBody(data);
    });
  });
}

function paintSummaryBody(data){
  const st = summaryState[state.lang];
  const page = data.summaryPages[st.page];
  document.getElementById('summaryBody').innerHTML = page.body;
  document.getElementById('pageIndicator').textContent = `صفحة ${st.page+1} من ${data.summaryPages.length}`;
  document.getElementById('prevPageBtn').disabled = st.page === 0;
  document.getElementById('nextPageBtn').disabled = st.page === data.summaryPages.length - 1;
}

/* ---------------------------------------------------------
   Q&A (10 practical coding questions per language)
--------------------------------------------------------- */
function renderQA(data){
  contentArea.innerHTML = `
    <h3 class="panel-title">أسئلة وأجوبة في <span class="accent">${data.name}</span></h3>
    <p class="panel-sub">10 تمارين برمجية عملية — فكّر بالحل أولًا، ثم اضغط لإظهاره</p>
    <div class="qa-list" id="qaList"></div>
  `;
  paintQA(data);
}

function paintQA(data){
  const list = document.getElementById('qaList');
  list.innerHTML = data.qaItems.map((item, i) => `
    <div class="qa-card">
      <div class="qa-question"><span class="qa-number">${i+1}</span>${escapeHtml(item.q)}</div>
      <button class="qa-toggle-btn" data-i="${i}">إظهار الحل</button>
      <div class="qa-solution" id="qaSolution${i}">
        <pre><code>${escapeHtml(item.code)}</code></pre>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.qa-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const i = btn.dataset.i;
      const sol = document.getElementById('qaSolution' + i);
      const isShown = sol.classList.toggle('show');
      btn.textContent = isShown ? 'إخفاء الحل' : 'إظهار الحل';
    });
  });
}

/* ---------------------------------------------------------
   QUIZ (40 questions)
--------------------------------------------------------- */
function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderQuiz(data){
  contentArea.innerHTML = `
    <h3 class="panel-title">اختبار <span class="accent">${data.name}</span></h3>
    <p class="panel-sub">40 سؤال اختيار من متعدد مع تصحيح فوري وشرح لكل إجابة</p>
    <div class="quiz-card" id="quizCard"></div>
  `;
  paintQuiz(data);
}

function paintQuiz(data){
  const card = document.getElementById('quizCard');
  const qs = quizState[state.lang];
  const total = data.quiz.length;

  if(qs.finished){
    const pct = Math.round((qs.score/total)*100);
    let verdict = 'أداء يحتاج مزيدًا من المراجعة';
    if(pct >= 85) verdict = 'أداء ممتاز! أنت تتقن أساسيات هذه اللغة';
    else if(pct >= 60) verdict = 'أداء جيد، استمر في المراجعة والتدرب';
    card.innerHTML = `
      <div class="quiz-result">
        <div class="score">${qs.score} / ${total}</div>
        <p>${verdict}</p>
        <button class="quiz-retry" id="retryBtn">إعادة الاختبار</button>
      </div>
    `;
    document.getElementById('retryBtn').addEventListener('click', () => {
      quizState[state.lang] = freshQuizState();
      paintQuiz(data);
    });
    return;
  }

  const q = data.quiz[qs.current];
  const pct = ((qs.current)/total)*100;
  card.innerHTML = `
    <div class="quiz-progress">
      <span class="count">${qs.current+1} / ${total}</span>
      <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="count">النقاط: ${qs.score}</span>
    </div>
    <p class="quiz-question">${escapeHtml(q.q)}</p>
    <div class="quiz-options" id="quizOptions">
      ${q.options.map((opt,i) => `<button class="quiz-opt" data-i="${i}">${escapeHtml(opt)}</button>`).join('')}
    </div>
    <div class="quiz-explain" id="quizExplain">${escapeHtml(q.explain)}</div>
    <div class="quiz-footer"><button class="quiz-next" id="quizNext">${qs.current === total-1 ? 'إنهاء الاختبار' : 'السؤال التالي'}</button></div>
  `;

  document.querySelectorAll('#quizOptions .quiz-opt').forEach(btn => {
    btn.addEventListener('click', () => handleAnswer(data, parseInt(btn.dataset.i)));
  });
}

function handleAnswer(data, chosenIndex){
  const qs = quizState[state.lang];
  if(qs.selected !== null) return;
  qs.selected = chosenIndex;
  const q = data.quiz[qs.current];
  if(chosenIndex === q.correct) qs.score++;

  document.querySelectorAll('#quizOptions .quiz-opt').forEach((btn,i) => {
    btn.classList.add('locked');
    if(i === q.correct) btn.classList.add('correct');
    else if(i === chosenIndex) btn.classList.add('wrong');
  });
  document.getElementById('quizExplain').style.display = 'block';
  document.getElementById('quizNext').style.display = 'inline-block';
  document.getElementById('quizNext').addEventListener('click', () => {
    qs.selected = null;
    if(qs.current === data.quiz.length - 1){
      qs.finished = true;
    }else{
      qs.current++;
    }
    paintQuiz(data);
  }, { once:true });
}

/* auto-grow textarea */
document.addEventListener('input', e => {
  if(e.target.id === 'chatInput'){
    e.target.style.height = 'auto';
    e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
  }
});
</script>
